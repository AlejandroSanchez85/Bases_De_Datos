spring.application.name=bogotickets
server.port=8080

# Conexión a PostgreSQL. La API entra con usuario_app, creado en sql/05_usuarios_permisos.sql.
# Si su PostgreSQL no usa el puerto 5432, cámbielo en la URL.
# La contraseña se puede dar en la variable de entorno DB_PASSWORD; si no existe,
# se usa la contraseña de ejemplo del script 05.
spring.datasource.url=jdbc:postgresql://localhost:5432/bogotickets
spring.datasource.username=usuario_app
spring.datasource.password=${DB_PASSWORD:Cambiar_App_2026}

# Fechas y horas en hora de Bogotá (CURRENT_DATE decide qué eventos ya se realizaron)
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Bogota'

# Documentación interactiva de los endpoints: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Quitar el # para ver en la consola el SQL que ejecuta cada petición
#logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
